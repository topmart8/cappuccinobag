name: Keyword research
on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"
permissions:
  contents: read
concurrency:
  group: cappuccino-keywords
  cancel-in-progress: false
jobs:
  keyword-research:
    runs-on: ubuntu-latest
    env:
      AUTOMATION_MODE: draft_only
      CONTENT_AUTO_PUBLISH: "false"
      CONTENT_AUTO_MERGE: "false"
      GITHUB_OWNER: topmart8
      GITHUB_REPO: cappuccinobag
      GITHUB_DEFAULT_BRANCH: main
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --ignore-scripts
      - run: npm run automation:scan
      - run: npm run automation:briefs
