<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cappuccino premium microfiber suede accessories placeholder</title>
  <desc id="desc">Pastel microfiber suede card holders, RFID wallets, passport holder, phone case and travel organizer in a luxury flat lay.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7efe7"/>
      <stop offset="0.52" stop-color="#fbf8f2"/>
      <stop offset="1" stop-color="#e7eee8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#8b6b4a" flood-opacity=".18"/>
    </filter>
    <filter id="texture">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" seed="18"/>
      <feColorMatrix type="saturate" values=".18"/>
      <feBlend mode="multiply" in2="SourceGraphic"/>
    </filter>
    <pattern id="stitch" width="26" height="8" patternUnits="userSpaceOnUse">
      <path d="M2 4h12" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity=".55"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <path d="M0 730c240-110 392-38 598-98 180-52 304-214 522-204 198 8 306 146 480 66v406H0z" fill="#e8ded3" opacity=".42"/>
  <g filter="url(#shadow)">
