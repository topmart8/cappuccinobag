    <rect x="212" y="258" width="198" height="70" rx="12" fill="none" stroke="url(#stitch)" stroke-width="5"/>
    <path d="M214 378h192M214 438h192M214 498h150" stroke="#8a977f" stroke-width="10" stroke-linecap="round" opacity=".55"/>
  </g>
  <g filter="url(#shadow)">
